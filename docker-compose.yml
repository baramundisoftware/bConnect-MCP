version: "3.9"

# bConnect MCP Suite — stdio deployment (Claude Desktop / Claude Code)
#
# Use case: single developer running MCP servers locally. Each server runs
# as a long-lived container; Claude connects via `docker exec` (stdio transport).
# No ports are exposed — this is not an HTTP deployment.
#
# For multi-user HTTP access (n8n, teams) use docker-compose.gateway.yml instead.
#
# Usage:
#   cp .env.example .env          # fill in BCONNECT_* credentials
#   docker compose up -d          # start all 13 servers
#   docker compose up -d bconnect-endpoints-mcp   # start one server only
#
# Claude Desktop / Claude Code config snippet:
#   "mcpServers": {
#     "bconnect-endpoints": {
#       "command": "docker",
#       "args": ["exec", "-i", "bconnect-endpoints-mcp", "node", "build/index.js"]
#     }
#   }

x-bconnect-common: &bconnect-common
  restart: unless-stopped
  environment:
    BCONNECT_BASE_URL: ${BCONNECT_BASE_URL:-https://bms-server/bconnect}
    BCONNECT_USERNAME: ${BCONNECT_USERNAME}
    BCONNECT_PASSWORD: ${BCONNECT_PASSWORD}
    BCONNECT_AUDIT_LEVEL: ${BCONNECT_AUDIT_LEVEL:-none}
    BCONNECT_SKIP_CONNECTIVITY_CHECK: ${BCONNECT_SKIP_CONNECTIVITY_CHECK:-false}
    NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-1}
    BCONNECT_CA_CERT_PATH: ${BCONNECT_CA_CERT_PATH:-}
  volumes:
    - ${BCONNECT_CA_CERT_PATH:-/dev/null}:${BCONNECT_CA_CERT_PATH:-/dev/null}:ro
  stdin_open: true
  tty: false

services:

  bconnect-activedirectory-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-activedirectory-mcp
      dockerfile: Dockerfile
    image: bconnect-activedirectory-mcp:26.1.0
    container_name: bconnect-activedirectory-mcp

  bconnect-assets-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-assets-mcp
      dockerfile: Dockerfile
    image: bconnect-assets-mcp:26.1.0
    container_name: bconnect-assets-mcp

  bconnect-compliance-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-compliance-mcp
      dockerfile: Dockerfile
    image: bconnect-compliance-mcp:26.1.0
    container_name: bconnect-compliance-mcp
    environment:
      BCONNECT_BASE_URL: ${BCONNECT_BASE_URL:-https://bms-server/bconnect}
      BCONNECT_USERNAME: ${BCONNECT_USERNAME}
      BCONNECT_PASSWORD: ${BCONNECT_PASSWORD}
      BCONNECT_AUDIT_LEVEL: ${BCONNECT_AUDIT_LEVEL:-none}
      BCONNECT_RELEASE: ${BCONNECT_RELEASE:-26R1}
      BCONNECT_SKIP_CONNECTIVITY_CHECK: ${BCONNECT_SKIP_CONNECTIVITY_CHECK:-false}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-1}

  bconnect-defensecontrol-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-defensecontrol-mcp
      dockerfile: Dockerfile
    image: bconnect-defensecontrol-mcp:26.1.0
    container_name: bconnect-defensecontrol-mcp

  bconnect-endpoints-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-endpoints-mcp
      dockerfile: Dockerfile
    image: bconnect-endpoints-mcp:26.1.0
    container_name: bconnect-endpoints-mcp

  bconnect-groups-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-groups-mcp
      dockerfile: Dockerfile
    image: bconnect-groups-mcp:26.1.0
    container_name: bconnect-groups-mcp

  bconnect-jobs-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-jobs-mcp
