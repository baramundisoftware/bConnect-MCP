version: "3.9"

# bConnect MCP Suite — Docker Compose reference configuration
#
# Usage:
#   1. Copy .env.example to .env and fill in your credentials
#   2. docker compose up -d
#
# All servers communicate via stdio (MCP transport) — they are not HTTP services.
# Each container is kept running and Claude Desktop connects via `docker exec`.
#
# Claude Desktop config snippet (claude_desktop_config.json):
#   "mcpServers": {
#     "bconnect-activedirectory": {
#       "command": "docker",
#       "args": ["exec", "-i", "bconnect-activedirectory-mcp", "node", "build/index.js"],
#       "env": {}
#     }
#   }

x-bconnect-common: &bconnect-common
  restart: unless-stopped
  environment:
    BCONNECT_BASE_URL: ${BCONNECT_BASE_URL:-https://bms-server/bconnect}
    BCONNECT_USERNAME: ${BCONNECT_USERNAME}
    BCONNECT_PASSWORD: ${BCONNECT_PASSWORD}
    BCONNECT_AUDIT_LEVEL: ${BCONNECT_AUDIT_LEVEL:-none}
    BCONNECT_SKIP_CONNECTIVITY_CHECK: ${BCONNECT_SKIP_CONNECTIVITY_CHECK:-false}
    NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-1}
    BCONNECT_CA_CERT_PATH: ${BCONNECT_CA_CERT_PATH:-}
  volumes:
    - ${BCONNECT_CA_CERT_PATH:-/dev/null}:${BCONNECT_CA_CERT_PATH:-/dev/null}:ro
  stdin_open: true
  tty: false

services:

  bconnect-activedirectory-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-activedirectory-mcp
      dockerfile: Dockerfile
    image: bconnect-activedirectory-mcp:26.1.0
    container_name: bconnect-activedirectory-mcp

  bconnect-assets-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-assets-mcp
      dockerfile: Dockerfile
    image: bconnect-assets-mcp:26.1.0
    container_name: bconnect-assets-mcp

  bconnect-compliance-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-compliance-mcp
      dockerfile: Dockerfile
    image: bconnect-compliance-mcp:26.1.0
    container_name: bconnect-compliance-mcp
    environment:
      BCONNECT_BASE_URL: ${BCONNECT_BASE_URL:-https://bms-server/bconnect}
      BCONNECT_USERNAME: ${BCONNECT_USERNAME}
      BCONNECT_PASSWORD: ${BCONNECT_PASSWORD}
      BCONNECT_AUDIT_LEVEL: ${BCONNECT_AUDIT_LEVEL:-none}
      BCONNECT_RELEASE: ${BCONNECT_RELEASE:-26R1}
      BCONNECT_SKIP_CONNECTIVITY_CHECK: ${BCONNECT_SKIP_CONNECTIVITY_CHECK:-false}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-1}

  bconnect-defensecontrol-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-defensecontrol-mcp
      dockerfile: Dockerfile
    image: bconnect-defensecontrol-mcp:26.1.0
    container_name: bconnect-defensecontrol-mcp

  bconnect-endpoints-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-endpoints-mcp
      dockerfile: Dockerfile
    image: bconnect-endpoints-mcp:26.1.0
    container_name: bconnect-endpoints-mcp

  bconnect-jobs-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-jobs-mcp
      dockerfile: Dockerfile
    image: bconnect-jobs-mcp:26.1.0
    container_name: bconnect-jobs-mcp

  bconnect-operatingsystems-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-operatingsystems-mcp
      dockerfile: Dockerfile
    image: bconnect-operatingsystems-mcp:26.1.0
    container_name: bconnect-operatingsystems-mcp

  bconnect-servermanagement-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-servermanagement-mcp
      dockerfile: Dockerfile
    image: bconnect-servermanagement-mcp:26.1.0
    container_name: bconnect-servermanagement-mcp

  bconnect-software-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-software-mcp
      dockerfile: Dockerfile
    image: bconnect-software-mcp:26.1.0
    container_name: bconnect-software-mcp

  bconnect-universaldynamicgroups-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-universaldynamicgroups-mcp
      dockerfile: Dockerfile
    image: bconnect-universaldynamicgroups-mcp:26.1.0
    container_name: bconnect-universaldynamicgroups-mcp
    environment:
      BCONNECT_BASE_URL: ${BCONNECT_BASE_URL:-https://bms-server/bconnect}
      BCONNECT_USERNAME: ${BCONNECT_USERNAME}
      BCONNECT_PASSWORD: ${BCONNECT_PASSWORD}
      BCONNECT_AUDIT_LEVEL: ${BCONNECT_AUDIT_LEVEL:-none}
      BCONNECT_RELEASE: ${BCONNECT_RELEASE:-26R1}
      BCONNECT_SKIP_CONNECTIVITY_CHECK: ${BCONNECT_SKIP_CONNECTIVITY_CHECK:-false}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-1}

  bconnect-updatemanagement-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-updatemanagement-mcp
      dockerfile: Dockerfile
    image: bconnect-updatemanagement-mcp:26.1.0
    container_name: bconnect-updatemanagement-mcp

  bconnect-variables-mcp:
    <<: *bconnect-common
    build:
      context: ./bconnect-variables-mcp
      dockerfile: Dockerfile
    image: bconnect-variables-mcp:26.1.0
    container_name: bconnect-variables-mcp

  # ── Unified MCP HTTP Gateway (optional) ──────────────────────
  # Serves all 13 MCP servers on a single HTTP port.
  # Start with: docker compose up mcp-gateway
  mcp-gateway:
    profiles: [gateway]
    build:
      context: .
      dockerfile: bconnect-mcp-gateway/Dockerfile
    image: bconnect-mcp-gateway:26.1.5
    container_name: mcp-gateway
    ports:
      - "${MCP_GATEWAY_HOST_PORT:-3001}:3001"
    environment:
      MCP_GATEWAY_PORT: "3001"
      MCP_GATEWAY_BIND: "0.0.0.0"
      # Token map auth (Option D). Set MCP_AUTH_CONFIG_PATH in .env to the host
      # path of your tokens.json — it will be mounted read-only at the path below.
      # When MCP_AUTH_CONFIG_PATH is unset, MCP_AUTH_CONFIG is empty and the
      # gateway falls back to the BCONNECT_* vars (single-credential mode).
      MCP_AUTH_CONFIG: ${MCP_AUTH_CONFIG_PATH:+/run/secrets/tokens.json}
      BCONNECT_BASE_URL: ${BCONNECT_BASE_URL:-https://bms-server/bconnect}
      BCONNECT_USERNAME: ${BCONNECT_USERNAME}
      BCONNECT_PASSWORD: ${BCONNECT_PASSWORD}
      BCONNECT_API_KEY: ${BCONNECT_API_KEY:-}
      BCONNECT_AUDIT_LEVEL: ${BCONNECT_AUDIT_LEVEL:-none}
      BCONNECT_SKIP_CONNECTIVITY_CHECK: ${BCONNECT_SKIP_CONNECTIVITY_CHECK:-false}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-1}
    volumes:
      # Mounts the host token map read-only when MCP_AUTH_CONFIG_PATH is set.
      # Falls back to /dev/null (harmless empty file) when not set.
      # Example .env entry: MCP_AUTH_CONFIG_PATH=/etc/mcp/tokens.json
      - ${MCP_AUTH_CONFIG_PATH:-/dev/null}:/run/secrets/tokens.json:ro
    restart: unless-stopped
