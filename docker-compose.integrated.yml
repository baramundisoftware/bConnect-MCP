# docker-compose.integrated.yml — Integrated test environment
#
# Brings up all components in a single Docker network:
#   1. bConnect Mock   (port 3433) — mock bConnect API
#   2. MCP Gateway     (port 3001) — unified HTTP gateway for all 13 MCP servers
#   3. n8n + connector (port 5678) — n8n with baramundi connector pre-installed
#
# Usage:
#   cp .env.example .env.integrated   # adjust if needed
#   docker compose -f docker-compose.integrated.yml up --build
#
# All services share the 'bconnect-net' network. The MCP gateway and n8n
# both connect to the mock via http://bconnect-mock:3433.

services:

  # ── bConnect Mock Server ──────────────────────────────────────
  bconnect-mock:
    build:
      context: ../bConnect-Mock
      dockerfile: Dockerfile
    image: bconnect-mock:latest
    container_name: bconnect-mock
    ports:
      - "${MOCK_HOST_PORT:-3433}:3433"
    environment:
      PORT: "3433"
      BIND_ADDRESS: "0.0.0.0"
      BCONNECT_PROFILE: "${BCONNECT_MOCK_PROFILE:-standard-readwrite}"
      BCONNECT_BMS_VERSION: "${BCONNECT_BMS_VERSION:-26r1}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      RATE_LIMIT_ENABLED: "false"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3433/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - bconnect-net

  # ── MCP Gateway ───────────────────────────────────────────────
  mcp-gateway:
    build:
      context: .
      dockerfile: bconnect-mcp-gateway/Dockerfile
    image: bconnect-mcp-gateway:dev
    container_name: mcp-gateway
    ports:
      - "${MCP_GATEWAY_HOST_PORT:-3001}:3001"
    environment:
      MCP_GATEWAY_PORT: "3001"
      MCP_GATEWAY_BIND: "0.0.0.0"
      BCONNECT_BASE_URL: "${BCONNECT_BASE_URL:-http://bconnect-mock:3433/bconnect}"
      BCONNECT_USERNAME: "${BCONNECT_USERNAME:-mockuser}"
      BCONNECT_PASSWORD: "${BCONNECT_PASSWORD:-mockpass}"
      BCONNECT_API_KEY: "${BCONNECT_API_KEY:-}"
      BCONNECT_SKIP_CONNECTIVITY_CHECK: "true"
      BCONNECT_AUDIT_LEVEL: "none"
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-0}"
    depends_on:
      bconnect-mock:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - bconnect-net

  # ── n8n with baramundi connector ──────────────────────────────
  # Uses the pre-built n8n-demo image (build separately via n8nworkflows/).
  # Set IMAGE_TAG to a local build: IMAGE_TAG=baramundi/n8n-demo:dev
  n8n:
    image: ${N8N_IMAGE_TAG:-baramundi/n8n-demo:dev}
    container_name: n8n-demo
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    environment:
      # bConnect target — defaults to mock, override via .env or environment
      BCONNECT_BASE_URL: "${BCONNECT_BASE_URL:-http://bconnect-mock:3433/bconnect}"
      BCONNECT_USERNAME: "${BCONNECT_USERNAME:-mockuser}"
      BCONNECT_PASSWORD: "${BCONNECT_PASSWORD:-mockpass}"
      BCONNECT_API_KEY: "${BCONNECT_API_KEY:-}"
      DISABLE_EMBEDDED_MOCK: "true"
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_DIAGNOSTICS_ENABLED: "false"
    depends_on:
      bconnect-mock:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    networks:
      - bconnect-net

networks:
  bconnect-net:
    driver: bridge

volumes:
  n8n_data:
