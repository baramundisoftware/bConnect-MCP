version: 2
# CI now runs in GitHub Actions (.github/workflows/ci.yml) as well as locally
# (`npm run ci`). Publish and release are still local.
#
# The github-actions ecosystem below is not optional hygiene. A workflow's
# `uses:` lines are dependencies with write access to the build, and a
# major-version tag like `actions/checkout@v4` is a MOVING reference — whoever
# controls that tag controls what runs in CI. Dependabot pinning them, and
# raising a PR when a pin should move, is the same property `npm ci` gives the
# JavaScript dependency graph: what runs is what was reviewed.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"


  - package-ecosystem: "npm"
    # Cover the root, the gateway, the template, and all 13 domain servers.
    # Glob support in `directories` fans this single entry across every manifest.
    directories:
      - "/"
      - "/bconnect-mcp-gateway"
      - "/bconnect-server-template"
      - "/bconnect-*-mcp"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Group updates so the monorepo does not produce one PR per manifest per dep.
    # Restrict groups to minor/patch so the routine PR stays green-and-mergeable;
    # majors arrive as separate PRs (deliberate migrations), and the breaking ones
    # below are ignored until planned.
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # Breaking majors handled as deliberate migration tasks, not auto-PRs.
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      # @types/express must track the express runtime major (currently v4).
      # A v5 types bump on a v4 runtime is a mismatch; upgrade both together
      # as part of the express major migration, not as a standalone types PR.
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
