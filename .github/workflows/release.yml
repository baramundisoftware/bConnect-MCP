name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Build shared core + all servers
        run: |
          npm run build -w @bconnect/mcp-core
          npm run build

      - name: Run tests
        run: npm test

      - name: Create release archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="bconnect-mcp-suite-${VERSION}.zip"
          mkdir -p release-package

          # Root workspace files — `npm ci` at the extracted root wires the shared
          # @bconnect/mcp-core package that every server imports.
          cp package.json package-lock.json README.md LICENSE CHANGELOG.md .env.example release-package/

          # Documentation — TRACKED files only. `git ls-files` never lists gitignored
          # internal docs (Bugs_*, NEXT-STEPS, SECURITY-AUDIT-*, docs/adr/), so they
          # are automatically excluded from the release.
          git ls-files docs/ SUPPORT.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md | while read -r f; do
            mkdir -p "release-package/$(dirname "$f")"
            cp "$f" "release-package/$f"
          done

          # Shared core (built) + the server-template manifest. Both are workspace
          # members, so their package.json must be present for `npm ci` to validate
          # the lockfile.
          mkdir -p release-package/packages/mcp-core release-package/bconnect-server-template
          cp -r packages/mcp-core/build release-package/packages/mcp-core/
          cp packages/mcp-core/package.json release-package/packages/mcp-core/
          cp bconnect-server-template/package.json release-package/bconnect-server-template/

          # Each server: built output + manifest + docs
          for dir in bconnect-*-mcp; do
            echo "Packaging $dir..."
            mkdir -p "release-package/$dir"
            cp -r "$dir/build" "release-package/$dir/"
            cp "$dir/package.json" "release-package/$dir/"
            [ -f "$dir/.env.example" ] && cp "$dir/.env.example" "release-package/$dir/" || true
            [ -f "$dir/README.md" ] && cp "$dir/README.md" "release-package/$dir/" || true
          done

          cat > release-package/INSTALL.md << 'INSTALLEOF'
          # Installation

          ## Prerequisites
          - Node.js 20 or later (https://nodejs.org/)
          - Your bMS server address and credentials

          ## Steps
          1. Extract this archive.
          2. From the extracted root, install runtime dependencies for the whole suite:

                 npm ci --omit=dev

             This wires the shared `@bconnect/mcp-core` package that every server imports.
          3. Copy `.env.example` to `.env` and fill in your credentials.
          4. Start a server, e.g.:

                 node bconnect-endpoints-mcp/build/index.js

          For the HTTP gateway and Docker options, see README.md and the docs/ folder.
          INSTALLEOF

          cd release-package && zip -r "../${ARCHIVE}" . && cd ..
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Extract release notes from CHANGELOG
        run: |
          # Extract the section for this version from CHANGELOG.md
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Release ${VERSION}" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release-notes.md
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          draft: false
          prerelease: true
