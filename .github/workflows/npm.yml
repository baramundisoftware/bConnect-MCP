# npm package @baramundi/bconnect-mcp: check on every change, publish on a version tag (#297),
# then list that version in the official MCP Registry (#430).
#
# ── What it does ────────────────────────────────────────────────────────────
# `check` packs the package, installs the tarball into an empty folder and
# starts the installed command (scripts/check-package.mjs) on Node 22, 24 and
# 26. The `gate` job of ci.yml runs the same check on Linux and Windows with 22
# and 24; Node 26 is checked here, outside the ruleset's required checks.
#
# `dry-run` runs on every pull request, manual run and tag:
# `npm publish --dry-run --tag next` builds the tarball and reports what would
# be published, and uploads nothing (`npm pack --dry-run` when the version is
# already on npm and this isn't a tag run, e.g. a dependency bump between
# releases). It needs no OIDC token and has read rights only.
#
# `publish` runs only on a version tag, and only when the repository variable
# NPM_PUBLISH_ENABLED is `true`. Until then a tag runs the checks and the dry
# run, warns, and stops: cutting a release doesn't publish by accident. The
# job runs in the `npm` environment, whose required reviewers approve every
# publish. npm lets a version be unpublished only within 72 hours.
#
# `registry` sends packages/bconnect-mcp/server.json to the MCP Registry
# (registry.modelcontextprotocol.io) as io.github.baramundisoftware/bconnect-mcp,
# after `publish` has put the same version on npm. It logs in with this run's
# GitHub OIDC token, which grants the namespace of the repository owner: no
# secret. The registry checks that the npm version exists and carries the same
# `mcpName`. A manual run with `register_existing` registers the version already
# on npm without publishing anything to npm (used once, for 26.2.0). A version
# can be registered only once; its entry can't be changed afterwards, only a
# later version replaces it. `dry-run` checks server.json with the registry's
# validate API on every run, which needs no login.
#
# ── One-time setup (when publishing is approved) ───────────────────────────
# 1. Settings → Environments → `npm`: required reviewers; deployment tags `v*`.
# 2. npm authentication, one of:
#    a) Trusted publishing (preferred, no secret): on npmjs.com, package
#       settings → Trusted Publisher → GitHub Actions, owner
#       `baramundisoftware`, repository `bConnect-MCP`, workflow `npm.yml`,
#       environment `npm`. npm offers this only for a package that already
#       exists, so the very first version needs b).
#    b) Token: a granular npm access token with publish rights for
#       @baramundi/bconnect-mcp (or the @baramundi scope), stored as the secret
#       NPM_TOKEN in the `npm` environment. Delete it, and the token on npm,
#       once a) is set up.
# 3. Settings → Variables → Actions: NPM_PUBLISH_ENABLED = true.
# 4. Settings → Environments → `mcp-registry`: required reviewers; deployment
#    branches and tags: `main` and `v*` (a manual run starts on main, a release
#    on its tag). No secret. A separate environment, so `npm`, which npm's
#    trusted publisher names, stays limited to tags.
#
# ── Tag rules ───────────────────────────────────────────────────────────────
# - Only `v<major>.<minor>.<patch>`, as for the gateway image (image.yml).
# - The tag must equal the version in packages/bconnect-mcp/package.json; the
#   release-version guard keeps that equal to the root version.
# - Dist-tag `next` while the project is a Technical Preview. The package's
#   prepublishOnly guard (publish-guard.mjs) refuses any other tag, and any
#   publish from outside GitHub Actions. npm sets `latest` too on a package's
#   first version: since 26.2.0 (2026-11-26) both point to it. A later version
#   moves only `next`; `latest` stays until it is moved on purpose
#   (`npm dist-tag add @baramundi/bconnect-mcp@<version> latest`, with 2FA).
# - The first publish showed a placeholder version `0.0.0-stage` for about
#   two minutes while npm processed the new package (staged publishing); it
#   stays in the version list, deprecated.
#
# ── Provenance ──────────────────────────────────────────────────────────────
# publishConfig.provenance is set, so the publish links the package to this
# workflow run and commit (#297 AC 2). That needs `id-token: write`, on the
# publish job only.

name: npm package

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths:
      - .github/workflows/npm.yml
      - 'packages/**'
      - 'bconnect-*-mcp/**'
      - package.json
      - package-lock.json
      - scripts/check-package.mjs
  workflow_dispatch:
    inputs:
      register_existing:
        description: "MCP Registry: register the version in packages/bconnect-mcp/package.json, which must already be on npm (nothing is published to npm)"
        type: boolean
        default: false

# Two runs for the same tag must not race each other to the registry.
concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    name: package check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-package.mjs

  dry-run:
    name: publish dry run
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Tag equals the package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./packages/bconnect-mcp/package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match packages/bconnect-mcp/package.json version $version."
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      # `npm publish --dry-run` fails when the version is already on npm. That is right for
      # a tag. A pull request or manual run between releases still carries the published
      # version, so it packs instead: the same tarball check, no registry clash.
      - name: npm publish (dry run)
        working-directory: packages/bconnect-mcp
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$IS_TAG" != "true" ] && npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm (not a tag run) → npm pack --dry-run"
            npm pack --dry-run
          else
            npm publish --dry-run --tag next
          fi

      # The registry's own validation (schema and its extra rules), without a login. The
      # ownership check against npm runs only on publish; the server.json guard test covers
      # name, version and arguments.
      - name: server.json passes the MCP Registry validation
        shell: bash
        run: |
          set -euo pipefail
          result=$(curl --fail --silent --show-error --max-time 60 -X POST -H 'Content-Type: application/json' \
            --data-binary @packages/bconnect-mcp/server.json https://registry.modelcontextprotocol.io/v0/validate)
          echo "$result"
          [ "$(node -p 'JSON.parse(process.argv[1]).valid' "$result")" = "true" ] \
            || { echo "::error::packages/bconnect-mcp/server.json fails the MCP Registry validation (see above)."; exit 1; }

      - name: Publishing disabled
        if: env.IS_TAG == 'true' && vars.NPM_PUBLISH_ENABLED != 'true'
        run: echo "::warning::Not published. NPM_PUBLISH_ENABLED is not 'true' (see the setup notes in npm.yml)."

  publish:
    name: publish to npm
    needs: dry-run
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@baramundi/bconnect-mcp?activeTab=versions
    permissions:
      contents: read
      # OIDC token for trusted publishing and the provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          # No dependency cache in the job that holds publish rights.

      # Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - name: npm version
        shell: bash
        run: |
          echo "npm $(npm --version)"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is older than 11.5.1, which trusted publishing needs."; exit 1; }

      - name: Tag equals the package version
        shell: bash
        run: |
          version=$(node -p "require('./packages/bconnect-mcp/package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match packages/bconnect-mcp/package.json version $version."
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      # prepack bundles dist/cli.js from this checkout. Without NPM_TOKEN, npm authenticates
      # through trusted publishing (OIDC).
      - name: npm publish
        working-directory: packages/bconnect-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag next

  registry:
    name: register in the MCP Registry
    needs: [dry-run, publish]
    # After a successful npm publish of a tag, or on a manual run from main with
    # register_existing. `!cancelled()` because `publish` is skipped on a manual run.
    if: >-
      !cancelled() && needs.dry-run.result == 'success' && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.register_existing && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: mcp-registry
      url: https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.baramundisoftware/bconnect-mcp
    permissions:
      contents: read
      # OIDC token for the registry login (namespace io.github.<repository owner>).
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
      # sha256 of mcp-publisher_linux_amd64.tar.gz of that release (its checksums file and
      # the GitHub release asset digest agree). Update both together, deliberately.
      MCP_PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: server.json matches the package
        shell: bash
        run: |
          set -euo pipefail
          cd packages/bconnect-mcp
          node -e '
            const pkg = require("./package.json"), srv = require("./server.json");
            const bad = [];
            if (srv.name !== pkg.mcpName) bad.push(`name ${srv.name} != mcpName ${pkg.mcpName}`);
            if (srv.version !== pkg.version) bad.push(`version ${srv.version} != ${pkg.version}`);
            for (const p of srv.packages) {
              if (p.identifier !== pkg.name || p.version !== pkg.version) bad.push(`package ${p.identifier}@${p.version} != ${pkg.name}@${pkg.version}`);
            }
            if (bad.length) { console.log(`::error::${bad.join("; ")}`); process.exit(1); }'
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "${GITHUB_REF_NAME#v}" != "$(node -p "require('./package.json').version")" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the package version."; exit 1
          fi

      # The registry refuses a version npm doesn't serve yet. Right after a publish npm can
      # take a moment; a staged version (not approved yet) never appears, and this stops.
      - name: The version is on npm with the registry name
        shell: bash
        run: |
          set -euo pipefail
          name=$(node -p "require('./packages/bconnect-mcp/package.json').name")
          version=$(node -p "require('./packages/bconnect-mcp/package.json').version")
          for i in $(seq 1 20); do
            got=$(npm view "$name@$version" mcpName 2>/dev/null || true)
            [ -n "$got" ] && break
            echo "$name@$version not on npm yet ($i/20)"; sleep 15
          done
          [ -n "$got" ] || { echo "::error::$name@$version is not on npm (still staged, or the publish failed); nothing registered."; exit 1; }
          echo "$name@$version on npm, mcpName $got"

      - name: Download mcp-publisher (pinned, checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/$archive"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum -c -
          tar xzf "$archive" mcp-publisher
          rm -f "$archive"

      - name: Log in to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Register in the MCP Registry
        run: ./mcp-publisher publish packages/bconnect-mcp/server.json

      - name: The entry is listed
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/bconnect-mcp/server.json').version")
          url="https://registry.modelcontextprotocol.io/v0.1/servers/io.github.baramundisoftware%2Fbconnect-mcp/versions/$version"
          for i in $(seq 1 10); do
            body=$(curl --fail --silent --show-error --max-time 60 "$url" 2>/dev/null) && break
            echo "not listed yet ($i/10)"; body=""; sleep 10
          done
          [ -n "$body" ] || { echo "::error::$url doesn't answer with the entry."; exit 1; }
          node -e '
            const e = JSON.parse(process.argv[1]), m = e._meta?.["io.modelcontextprotocol.registry/official"] ?? {};
            console.log(`listed: ${e.server.name} ${e.server.version}, ${m.status}, published ${m.publishedAt}`);' "$body"
