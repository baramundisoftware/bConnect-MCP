name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - bconnect-activedirectory-mcp
          - bconnect-assets-mcp
          - bconnect-compliance-mcp
          - bconnect-defensecontrol-mcp
          - bconnect-endpoints-mcp
          - bconnect-groups-mcp
          - bconnect-jobs-mcp
          - bconnect-operatingsystems-mcp
          - bconnect-servermanagement-mcp
          - bconnect-software-mcp
          - bconnect-universaldynamicgroups-mcp
          - bconnect-updatemanagement-mcp
          - bconnect-variables-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.server }}/package-lock.json

      - name: Install dependencies
        run: cd ${{ matrix.server }} && npm ci

      - name: Build
        run: cd ${{ matrix.server }} && npm run build

      - name: Test
        run: cd ${{ matrix.server }} && npm test

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Audit all servers
        run: |
          failures=0
          for dir in bconnect-*-mcp bconnect-server-template; do
            echo "=== $dir ==="
            (cd "$dir" && npm ci --ignore-scripts && npm audit --audit-level=high) || failures=$((failures + 1))
          done
          if [ $failures -gt 0 ]; then
            echo "⚠️ $failures server(s) have audit findings (non-blocking)"
          fi

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Static analysis of first-party code (complements the dependency-only audit).
    # Non-blocking: findings are surfaced (the step reports failure via --error)
    # but continue-on-error keeps them from gating the build.
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Semgrep scan (non-blocking — report only)
        continue-on-error: true
        run: >
          semgrep scan
          --config p/security-audit
          --config p/secrets
          --config p/typescript
          --config p/nodejs
          --error
          --metrics=off
          --exclude build
          --exclude node_modules
          --exclude tests
          --exclude __tests__
          --exclude fixtures
          --exclude '*.test.ts'
