name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - bconnect-activedirectory-mcp
          - bconnect-assets-mcp
          - bconnect-compliance-mcp
          - bconnect-defensecontrol-mcp
          - bconnect-endpoints-mcp
          - bconnect-groups-mcp
          - bconnect-jobs-mcp
          - bconnect-operatingsystems-mcp
          - bconnect-servermanagement-mcp
          - bconnect-software-mcp
          - bconnect-universaldynamicgroups-mcp
          - bconnect-updatemanagement-mcp
          - bconnect-variables-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.server }}/package-lock.json

      - name: Install dependencies
        run: cd ${{ matrix.server }} && npm ci

      - name: Build
        run: cd ${{ matrix.server }} && npm run build

      - name: Test
        run: cd ${{ matrix.server }} && npm test

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Audit all servers
        run: |
          failures=0
          for dir in bconnect-*-mcp bconnect-server-template; do
            echo "=== $dir ==="
            (cd "$dir" && npm ci --ignore-scripts && npm audit --audit-level=high) || failures=$((failures + 1))
          done
          if [ $failures -gt 0 ]; then
            echo "⚠️ $failures server(s) have audit findings (non-blocking)"
          fi
