name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test ${{ matrix.server }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        server:
          - bconnect-activedirectory-mcp
          - bconnect-assets-mcp
          - bconnect-compliance-mcp
          - bconnect-defensecontrol-mcp
          - bconnect-endpoints-mcp
          - bconnect-groups-mcp
          - bconnect-jobs-mcp
          - bconnect-operatingsystems-mcp
          - bconnect-servermanagement-mcp
          - bconnect-software-mcp
          - bconnect-universaldynamicgroups-mcp
          - bconnect-updatemanagement-mcp
          - bconnect-variables-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces)
        shell: bash
        # Strict, reproducible install on normal branches. Dependabot's
        # regenerated root lockfile omits the workspace self-links
        # (bconnect-*-mcp@x.y.z), so `npm ci` fails on its PRs — reconcile
        # with `npm install` for Dependabot branches only (see issue #70).
        # Context values go through env (not inline ${{ }}) to avoid script injection.
        env:
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if npm ci; then
            :
          elif [[ "$ACTOR" == "dependabot[bot]" || "$HEAD_REF" == dependabot/* ]]; then
            echo "::notice::Lockfile out of sync on a Dependabot branch — reconciling with 'npm install'."
            npm install --no-audit --no-fund
          else
            echo "::error::'npm ci' failed: package-lock.json is out of sync. Run 'npm install' and commit package-lock.json."
            exit 1
          fi

      - name: Build shared core
        run: npm run build -w @bconnect/mcp-core

      - name: Build
        run: npm run build -w ${{ matrix.server }}

      - name: Test
        run: npm test -w ${{ matrix.server }}

  security:
    name: Security Audit
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces)
        shell: bash
        # See the test job: reconcile Dependabot's out-of-sync workspace
        # lockfile (issue #70), strict `npm ci` everywhere else.
        env:
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if npm ci --ignore-scripts; then
            :
          elif [[ "$ACTOR" == "dependabot[bot]" || "$HEAD_REF" == dependabot/* ]]; then
            echo "::notice::Lockfile out of sync on a Dependabot branch — reconciling with 'npm install'."
            npm install --ignore-scripts --no-audit --no-fund
          else
            echo "::error::'npm ci' failed: package-lock.json is out of sync. Run 'npm install' and commit package-lock.json."
            exit 1
          fi

      - name: Audit (all workspaces)
        run: npm audit --audit-level=high || echo "⚠️ audit findings (non-blocking)"

  sast:
    name: SAST (Semgrep)
    runs-on: self-hosted
    # Static analysis of first-party code (complements the dependency-only audit).
    # Non-blocking: findings are surfaced (the step reports failure via --error)
    # but continue-on-error keeps them from gating the build.
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Semgrep scan (non-blocking — report only)
        continue-on-error: true
        run: >
          semgrep scan
          --config p/security-audit
          --config p/secrets
          --config p/typescript
          --config p/nodejs
          --error
          --metrics=off
          --exclude build
          --exclude node_modules
          --exclude tests
          --exclude __tests__
          --exclude fixtures
          --exclude '*.test.ts'

  duplication:
    name: Duplication guard (jscpd)
    runs-on: self-hosted
    # Guards the Q1/Q2 shared-core extraction: fails if client/util code is
    # copy-pasted back across servers. Config + threshold live in .jscpd.json
    # (generated types and the server-specific validation rules are excluded).
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Check for copy-pasted client/util code
        # Pin the version: jscpd's detection changes across majors, which would
        # make the threshold non-reproducible (config lives in .jscpd.json).
        run: npx --yes jscpd@5.0.11 bconnect-*-mcp/src bconnect-server-template/src
