# Continuous integration.
#
# ── Why this exists, when scripts/ci-local.sh already did ───────────────────
# It did not exist, and its own header said so: "GitHub Actions is not used;
# this replaces it." That was defensible while this was an internal rebuild
# with one machine and one operator. It is not defensible for a public
# repository, where the first thing a contributor's pull request needs is a
# gate that runs without asking them to trust — or reproduce — someone's
# local shell.
#
# ── Four jobs, and the split is deliberate ─────────────────────────────────
# `gate` runs on BOTH Linux and Windows. That is not box-ticking. This repo
# shipped a defect where a clone on Windows with core.autocrlf=true failed its
# own test suite, aborted a package's build, and cascaded into failures in two
# unrelated servers — while `git status` and `git diff` showed a clean tree, so
# a contributor had no way to self-diagnose. A Linux-only runner would have
# been green throughout. The Windows leg is there to catch that class.
#
# Lint moved INTO `gate` on 2026-08-03 and is blocking. `strict` now carries
# only the dependency audit, which reports and does not block — `npm audit
# --audit-level=high` at the root is clean (0 vulnerabilities, measured
# 2026-08-04), so this is a standing policy rather than an untriaged backlog.
# See the rationale on the `strict` job for why a clean audit is not by itself
# a reason to promote it into `gate`.
#
# `coverage` measures every shipped workspace in one run and fails below a
# floor; it is not one of the required checks (see the job).
#
# `mock` runs the mock-integration tier against bConnect-Mock, once per bMS
# release (25r2, 26r1); not one of the required checks either (see the job).
#
# ── Relationship to scripts/ci-local.sh ────────────────────────────────────
# That script remains the richer local gate (jscpd, semgrep). The
# mock-integration tier runs in the `mock` job below, against a pinned
# bConnect-Mock image (REQ-CI-002); by hand it is `node scripts/mock-tier.mjs`
# (docs/MOCK_INTEGRATION_TESTING.md). This workflow is
# deliberately NOT a second copy of it: it runs the root `vitest run`, which
# covers every per-server suite and every suite-wide guard in one pass, so
# there is no per-server list here to drift out of step with the one there.

name: CI

# `push` on `main` only: a PR commit is covered by `pull_request`. With `push`
# on every branch as well, each PR commit ran the whole matrix twice. A branch
# without a PR can still be run by hand (`workflow_dispatch`). REQ-CI-001.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ── Why every `run` step needs a working directory ─────────────────────────
# This workflow lives at the ROOT of the working repository, because that is
# the only place GitHub Actions looks for it. The npm workspace root is one
# level down, in `bConnect-MCP-main/`, and that subtree is what gets published
# as its own repository — where this file sits at ITS root and needs no such
# indirection. Both layouts are real; this setting is what makes the file
# correct in the one it is currently checked out in.
#
# `defaults.run` applies to `run` steps ONLY. It does NOT reach `uses:` steps,
# which is why each `setup-node` below carries an explicit
# `cache-dependency-path` — without it, `cache: npm` globs from the workspace
# root, finds no lockfile there, and fails the job before anything is built.
#
# The installer step looks in BOTH `install/lib` and `../install/lib`. With the
# working directory set below, `..` is the checkout root, where `install/` lives
# here; in a publication cut the suite IS the root and `install/` is inside it.
#
# This paragraph used to say the step "correctly finds nothing and skips" in the
# published subtree. That was wrong twice over: the cut ships `install/`, and
# the skip meant `test-catalog-drift` had never executed in CI under any layout
# while reporting success. Both fixed; the explanation is corrected here because
# it read perfectly reasonably and was the reason nobody looked.
defaults:
  run:
    working-directory: .

jobs:
  gate:
    name: build + test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22.15+ is the floor that matters: below it Node does not consult the
        # OS trust store, which is how an internal CA signing the bMS
        # certificate becomes invisible (issue #59). 24.x is the forward check.
        node: ["22.15", "24"]
    # The ruleset "main protection" requires these checks BY NAME, from the
    # GitHub Actions app (REQ-CI-001). Renaming this job or changing the matrix
    # changes the names: update the ruleset in the same PR, or every PR waits
    # for a check that never arrives. `__tests__/ci-workflow.guard.test.ts`
    # fails if this list and the matrix drift apart.
    # required-checks:begin
    #   - build + test (ubuntu-latest, node 22.15)
    #   - build + test (ubuntu-latest, node 24)
    #   - build + test (windows-latest, node 22.15)
    #   - build + test (windows-latest, node 24)
    # required-checks:end

    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits: the PR merge commit and its base, for the cast diff check.
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      # npm runs package scripts with cmd.exe on Windows; the root build script
      # is a bash loop. Use Git Bash (preinstalled on the runner), as the README
      # requires for Windows builds.
      - name: Use Git Bash for npm scripts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: npm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"

      # `npm ci`, never `npm install` — SECURITY.md requires it, and the
      # property is the point: this fails if the lockfile and the manifests
      # would diverge, so CI cannot silently resolve a dependency graph nobody
      # reviewed.
      - name: Install from the lockfile
        run: npm ci

      # The root build script builds the shared core first, then every server
      # and the template, and stops at the first failure (#273).
      - name: Build all workspaces
        run: npm run build

      # Blocking: 0 errors, 0 warnings (`--max-warnings 0` in the root `lint`
      # script), servers, template and the shared core. Type-defeating casts
      # (`as never`, `as unknown as`, angle-bracket casts) are errors; the `as`
      # casts that existed when the rule came in are listed per file in
      # eslint-suppressions.json: a file's total can't grow, and a removed cast
      # fails until the list is pruned (`npm run lint:prune-casts`). REQ-QA-002.
      # No `--if-present`: this step used to run against a root without a
      # `lint` script and passed without linting anything.
      - name: Lint
        run: npm run lint

      # The suppressions above count casts per file; this fails on any added
      # line with a cast, so one can't move between handlers (REQ-QA-002 AC 3).
      - name: No new type-defeating casts
        shell: bash
        run: scripts/check-new-casts.sh HEAD^1

      # The root run covers every per-server suite AND the suite-wide guards.
      - name: Test
        run: npx vitest run

      # The installer's own guards are plain Node. `test-catalog-drift` is the
      # one that matters here: it derives the truth from the BUILT servers and
      # caught catalog.json naming a read probe the round-3 collapse had
      # removed — drift no TypeScript test could see.
      #
      # `install/` sits BESIDE this subtree in the working repository and INSIDE
      # the tree in a publication cut, whose root is this suite. Looking in only
      # one of those is how `test-catalog-drift` has never once executed in CI:
      # the publication tree's own workflow tests `../install/lib` while its
      # `install/` is at the root, so the step printed "installer guards skipped"
      # and went green, in the one tree where the guard matters most.
      #
      # Still skipped rather than failed when genuinely absent — a step that
      # reddens a public contributor's partial checkout is noise, and noise is how
      # a gate stops being read — but the skip now says which paths it looked in,
      # so a path bug cannot go on looking like a legitimate absence.
      - name: Installer guards (skipped when the installer is not in the checkout)
        shell: bash
        run: |
          if [ -d install/lib ]; then
            LIB=install/lib
          elif [ -d ../install/lib ]; then
            LIB=../install/lib
          else
            echo "install/ is not part of this checkout — installer guards skipped."
            echo "  looked in: ./install/lib and ../install/lib (from $(pwd))"
            exit 0
          fi
          echo "installer guards running from $LIB"
          node "$LIB/test-host-emitters.mjs"
          node "$LIB/test-catalog-drift.mjs"

  coverage:
    name: coverage floors
    runs-on: ubuntu-latest
    # One root run over every shipped workspace: the shared core, the 13 servers
    # and the gateway, entry points included. The floors are in the root
    # vitest.config.ts (total, and one per workspace a little under what it
    # achieves); below any of them this job fails. It is not one of the
    # ruleset's required checks: a red result here is read and acted on, it
    # does not block a merge on its own.
    #
    # It replaced a loop of per-workspace runs. Each of those saw only its own
    # few test files, skipped index.ts and never measured the core (servers
    # load the core's build), so it reported 4–31 % for servers that are at
    # 100 %. `__tests__/coverage-config.guard.test.ts` fails when a workspace
    # is missing from the root include list or has no floor.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.15"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Some tests start the built servers as child processes.
      - run: npm run build
      - run: npm run test:coverage

      # The report is kept when the floors fail too: that is when it is read.
      - name: Upload the HTML coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  mock:
    name: mock tier (${{ matrix.release }})
    runs-on: ubuntu-latest
    # The mock-integration tier: every server's `npm run test:mock` against
    # bConnect-Mock, once per bMS release (REQ-CI-002, #311). The unit tier runs
    # against in-process stubs; this one sends real requests to the mock's routes
    # and fixtures, which is where a wrong path or field shows. Not one of the
    # ruleset's required checks (decided separately).
    #
    # scripts/mock-tier.mjs checks the mock's /health for the release first and
    # fails on a failed server AND on a skipped one: a mock test returns early
    # when the mock isn't reachable, and vitest reports that as passed. The
    # mock's rate limit is off for the same reason (a 429 on /health reads as
    # "not reachable"). On 25r2 the runner leaves out the servers whose APIs
    # are 26R1 only; `__tests__/mock-tier.guard.test.ts` checks this job.
    strategy:
      fail-fast: false
      matrix:
        release: ["26r1", "25r2"]
    env:
      # The one place the mock version is pinned; raising it is this line.
      BCONNECT_MOCK_IMAGE: ghcr.io/baramundisoftware/bconnect-mock:0.8.0
      BCONNECT_MOCK_URL: http://127.0.0.1:13433
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.15"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Start bConnect-Mock
        run: |
          docker run -d --name bconnect-mock -p 127.0.0.1:13433:3433 \
            -e BCONNECT_BMS_VERSION=${{ matrix.release }} -e RATE_LIMIT_ENABLED=false \
            "$BCONNECT_MOCK_IMAGE"
          echo "bConnect-Mock: $(docker image inspect "$BCONNECT_MOCK_IMAGE" --format '{{index .RepoDigests 0}}'), bMS ${{ matrix.release }}"
      - run: npm ci
      - run: npm run build
      - name: Run the mock tier
        run: node scripts/mock-tier.mjs ${{ matrix.release }}
      - name: Mock log (on failure)
        if: failure()
        run: docker logs bconnect-mock 2>&1 | tail -100

  strict:
    name: dependency audit (reported, not blocking)
    runs-on: ubuntu-latest
    # Never fails the build, and this is now a decision rather than a holding
    # pattern.
    #
    # The earlier comment here said each reported check "becomes a `gate` step
    # when its backlog is actually clear". The audit backlog IS clear —
    # `npm audit --audit-level=high` at the root reports 0 vulnerabilities
    # (measured 2026-08-04) — and it still does not move, because the trigger
    # assumed something untrue of this particular check: `npm audit` is the one
    # step whose result can change with no commit at all. It queries the live
    # advisory database, so a new advisory published overnight against a
    # transitive dependency turns every open pull request red for a reason no
    # contributor introduced and most cannot fix. Blocking on it does not make
    # the advisory get fixed sooner; it makes CI something people learn to
    # override, and an overridden gate protects nothing.
    #
    # Reported as a warning annotation plus a job-summary line, not via
    # job-level `continue-on-error`, which left a red check on every PR
    # (REQ-CI-001). A failed `npm ci` still fails the job.
    #
    # What blocks instead is the property this repo can actually hold: `gate`
    # runs `npm ci`, which fails if the lockfile and the manifests would
    # diverge — so the dependency graph cannot change without review, which is
    # the half a contributor's PR is genuinely responsible for. Read this job's
    # output when it warns; do not gate a merge on it.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.15"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: Dependency audit
        run: |
          if npm audit --audit-level=high; then
            echo "✅ npm audit: no high or critical advisories." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::npm audit reports high/critical advisories or could not run (reported, not blocking). See this job's log."
            echo "⚠️ npm audit: high/critical advisories or audit error (reported, not blocking). See the log." >> "$GITHUB_STEP_SUMMARY"
          fi
