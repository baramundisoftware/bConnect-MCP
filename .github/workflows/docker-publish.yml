name: Publish gateway image

# Publishes ONLY the gateway image to GHCR (ADR-003). The 13 domain servers
# run over stdio (Claude Desktop) and are not distributed as containers.
#
#   git tag vX.Y.Z + push  ->  ghcr.io/…/bconnect-mcp-gateway:X.Y.Z + :X.Y + :latest
#   push to main           ->  ghcr.io/…/bconnect-mcp-gateway:edge
#   (every build also gets an immutable :sha-<short> tag for traceability)
#
# Local development still uses `make build-gateway` in come2gether-2026-challenge.
#
# Action refs are pinned to commit SHAs (repo convention, see ci.yml);
# Dependabot's github-actions ecosystem keeps them updated.

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: baramundisoftware/bconnect-mcp-gateway

jobs:
  publish-gateway:
    name: Build & publish gateway
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags + OCI provenance labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is applied automatically on semver tags only (not on edge).
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=bconnect-mcp-gateway
            org.opencontainers.image.description=bConnect MCP HTTP gateway (multi-user / n8n)

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: bconnect-mcp-gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
