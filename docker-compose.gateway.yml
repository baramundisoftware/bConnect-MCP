# bConnect MCP Gateway — HTTP deployment (multi-user, n8n, teams)
#
# Use case: shared MCP access over HTTP for multiple users or workflows.
# A single container bundles all 13 MCP servers behind one HTTP endpoint.
#
# ⚠️ The gateway has NO built-in authentication. This compose publishes the port
# on LOOPBACK ONLY. Before exposing it beyond the host you MUST front it with a
# TLS-terminating, authenticating reverse proxy (see README / docs/DOCKER.md).
# Downstream bMS calls use a single BCONNECT_* service credential.
#
# For single-developer stdio use (Claude Desktop / Claude Code), run the
# servers directly with Node.js instead (docs/INSTALLATION.md).
#
# See docs/INSTALLATION.md and docs/N8N.md for full setup.
#
# Usage:
#   cp .env.gateway.example .env.gateway
#   # Edit .env.gateway — set BCONNECT_BASE_URL and the BCONNECT_* service credential
#   docker compose -f docker-compose.gateway.yml --env-file .env.gateway up -d
#
# Health check:
#   curl http://localhost:3001/health
#   # → {"status":"ok","servers":[...],"count":13}

services:

  mcp-gateway:
    build:
      context: .
      dockerfile: bconnect-mcp-gateway/Dockerfile
    image: bconnect-mcp-gateway:26.1.9
    container_name: mcp-gateway
    ports:
      # Loopback-only by default — reachable from the host / a co-located proxy,
      # not the network. Override MCP_GATEWAY_HOST_BIND only once a proxy is in front.
      - "${MCP_GATEWAY_HOST_BIND:-127.0.0.1}:${MCP_GATEWAY_HOST_PORT:-3001}:3001"
    environment:
      MCP_GATEWAY_PORT: "3001"
      # The container binds 0.0.0.0 so a co-located proxy can reach it; the port
      # above is published on loopback. MCP_ALLOW_NO_AUTH asserts a proxy handles
      # auth — the gateway has no built-in auth (ADR-0003).
      MCP_GATEWAY_BIND: "0.0.0.0"
      MCP_ALLOW_NO_AUTH: "true"
      # Host names the gateway answers to, besides localhost / 127.0.0.1 / [::1]:
      # the service name, for clients on the same Docker network (e.g. n8n), and
      # whatever your proxy sends as Host. Other host names get 403. Setting the
      # variable replaces the default: keep mcp-gateway in your list.
      MCP_GATEWAY_ALLOWED_HOSTS: ${MCP_GATEWAY_ALLOWED_HOSTS:-mcp-gateway}
      # Single bConnect service credential (bMS RBAC governs it).
      BCONNECT_BASE_URL: ${BCONNECT_BASE_URL:-https://bms-server/bconnect}
      # http:// to a host other than the container itself needs this opt-in (credentials unencrypted).
      BCONNECT_ALLOW_INSECURE_HTTP: ${BCONNECT_ALLOW_INSECURE_HTTP:-false}
      BCONNECT_USERNAME: ${BCONNECT_USERNAME:-}
      BCONNECT_PASSWORD: ${BCONNECT_PASSWORD:-}
      BCONNECT_API_KEY: ${BCONNECT_API_KEY:-}
      BCONNECT_AUDIT_LEVEL: ${BCONNECT_AUDIT_LEVEL:-none}
      BCONNECT_SKIP_CONNECTIVITY_CHECK: ${BCONNECT_SKIP_CONNECTIVITY_CHECK:-false}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-1}
      BCONNECT_CA_CERT_PATH: ${BCONNECT_CA_CERT_PATH:-}
      # bMS release whose tools are registered: 26R1 (default) or 25R2.
      BCONNECT_RELEASE: ${BCONNECT_RELEASE:-26R1}
      # Outbound rate limit towards bConnect (off by default).
      BCONNECT_RATE_LIMIT_ENABLED: ${BCONNECT_RATE_LIMIT_ENABLED:-false}
      BCONNECT_RATE_LIMIT_MAX_REQUESTS: ${BCONNECT_RATE_LIMIT_MAX_REQUESTS:-100}
      BCONNECT_RATE_LIMIT_WINDOW_MS: ${BCONNECT_RATE_LIMIT_WINDOW_MS:-60000}
      # Request timeout and read-only retries towards bConnect (#162).
      BCONNECT_TIMEOUT_MS: ${BCONNECT_TIMEOUT_MS:-30000}
      BCONNECT_MAX_RETRIES: ${BCONNECT_MAX_RETRIES:-0}
      # Inbound rate limit per client IP and request body cap (#98).
      MCP_GATEWAY_RATE_LIMIT_ENABLED: ${MCP_GATEWAY_RATE_LIMIT_ENABLED:-true}
      MCP_GATEWAY_RATE_LIMIT_MAX: ${MCP_GATEWAY_RATE_LIMIT_MAX:-300}
      MCP_GATEWAY_RATE_LIMIT_WINDOW_MS: ${MCP_GATEWAY_RATE_LIMIT_WINDOW_MS:-60000}
      MCP_GATEWAY_MAX_BODY: ${MCP_GATEWAY_MAX_BODY:-1mb}
      # Logging (#98).
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    volumes:
      # CA certificate for self-signed bMS certificates (optional).
      - ${BCONNECT_CA_CERT_PATH:-/dev/null}:${BCONNECT_CA_CERT_PATH:-/dev/null}:ro
    restart: unless-stopped
    # Resource limits (audit H2): bound a runaway request rate / per-request
    # server creation from exhausting the host. Tune via .env.gateway.
    deploy:
      resources:
        limits:
          memory: ${MCP_GATEWAY_MEM_LIMIT:-512m}
          cpus: "${MCP_GATEWAY_CPU_LIMIT:-1.0}"
          pids: 512
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
